[project]
name = "ai-config-gen"
version = "0.5.0"
description = "Analyze any codebase and generate optimized config files for AI coding assistants (.claude.md, .cursorrules, .windsurfrules)"
readme = "PRODUCT_README.md"
requires-python = ">=3.13"
dependencies = []
license = {text = "MIT"}
authors = [{name = "Marcin Kuk", email = "marcinkuk@users.noreply.github.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai", "claude", "cursor", "windsurf", "config", "coding-assistant", "ide", "markdown"]

[project.urls]
Homepage = "https://github.com/marcinkuk/ai-config-gen"
Repository = "https://github.com/marcinkuk/ai-config-gen"
Issues = "https://github.com/marcinkuk/ai-config-gen/issues"
"Source Code" = "https://github.com/marcinkuk/ai-config-gen"
"Bug Tracker" = "https://github.com/marcinkuk/ai-config-gen/issues"

[project.scripts]
ai-config-gen = "ai_config_gen:main"
