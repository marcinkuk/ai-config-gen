name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install fastapi uvicorn pydantic

      - name: Run tests
        run: |
          python -m pytest src/test_ai_config_gen.py -v

      - name: Validate CLI works
        run: |
          python src/ai_config_gen.py --help

      - name: Test CLI on sample project
        run: |
          python src/create_test_projects.py
          python src/ai_config_gen.py test_projects/fastapi_project --verbose